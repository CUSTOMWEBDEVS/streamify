<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0d1017" />
  <title>Streamify</title>
  <link rel="manifest" href="./manifest.json" />

  <style>
    :root{
      --bg:#0b0f17;
      --bg2:#0f1420;
      --panel:#111827;
      --panel2:#151d2f;
      --panel3:#0f1725;
      --stroke:rgba(255,255,255,.08);
      --stroke2:rgba(255,255,255,.14);
      --text:#eef3ff;
      --muted:rgba(238,243,255,.62);
      --accent:#1db954;
      --accent2:#5865f2;
      --danger:#ff6f7d;
      --shadow:0 24px 70px rgba(0,0,0,.45);
      --r:20px;
      --r2:16px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 8% -10%, rgba(29,185,84,.12), transparent 60%),
        radial-gradient(1000px 600px at 100% -10%, rgba(88,101,242,.14), transparent 60%),
        linear-gradient(180deg, var(--bg2), var(--bg));
      overflow-x:hidden;
    }

    .app{
      display:grid;
      grid-template-columns: 280px 1fr;
      gap:16px;
      max-width:1600px;
      margin:0 auto;
      padding:16px;
      padding-bottom:120px;
    }

    @media (max-width: 980px){
      .app{grid-template-columns:1fr}
    }

    .panel{
      background:linear-gradient(180deg, rgba(17,24,39,.88), rgba(15,23,37,.88));
      border:1px solid var(--stroke);
      border-radius:var(--r);
      backdrop-filter: blur(12px);
      box-shadow:var(--shadow);
    }

    .sidebar{
      position:sticky;
      top:16px;
      height:calc(100vh - 32px);
      overflow:auto;
      padding:14px;
    }

    @media (max-width: 980px){
      .sidebar{
        position:relative;
        top:auto;
        height:auto;
      }
    }

    .brand{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:12px;
      border:1px solid var(--stroke);
      border-radius:16px;
      background:rgba(255,255,255,.03);
    }

    .brandLeft{display:flex;align-items:center;gap:12px;min-width:0}
    .mark{
      width:12px;height:12px;border-radius:999px;
      background:var(--accent);
      box-shadow:0 0 0 8px rgba(29,185,84,.10);
      flex:0 0 auto;
    }
    .brandText{min-width:0}
    .brandText .title{
      font-weight:800;
      letter-spacing:.2px;
      font-size:15px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .brandText .sub{
      font-size:12px;
      color:var(--muted);
      margin-top:2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .chip{
      font-size:12px;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid rgba(29,185,84,.24);
      background:rgba(29,185,84,.10);
      color:rgba(29,185,84,.98);
      white-space:nowrap;
    }

    .section{
      margin-top:16px;
    }

    .sectionHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 8px 8px;
      font-size:12px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.08em;
    }

    .navBtn{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:11px 12px;
      border-radius:14px;
      border:1px solid transparent;
      background:transparent;
      color:var(--text);
      cursor:pointer;
      transition:.16s ease;
      margin-bottom:6px;
    }

    .navBtn:hover{
      background:rgba(255,255,255,.05);
      border-color:var(--stroke);
    }

    .navBtn.active{
      background:linear-gradient(180deg, rgba(88,101,242,.16), rgba(29,185,84,.10));
      border-color:rgba(255,255,255,.10);
    }

    .pill{
      font-size:11px;
      min-width:28px;
      padding:2px 8px;
      text-align:center;
      border-radius:999px;
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.05);
      color:rgba(255,255,255,.84);
    }

    .playlistList, .categoryList{
      display:flex;
      flex-direction:column;
      gap:4px;
    }

    .playlistItem{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:11px 12px;
      border-radius:14px;
      border:1px solid transparent;
      cursor:pointer;
      transition:.16s ease;
    }

    .playlistItem:hover{
      background:rgba(255,255,255,.05);
      border-color:var(--stroke);
    }

    .playlistItem.active{
      background:linear-gradient(180deg, rgba(88,101,242,.16), rgba(29,185,84,.10));
      border-color:rgba(255,255,255,.10);
    }

    .playlistName{
      font-size:13px;
      font-weight:700;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
    }

    .btn{
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.04);
      color:var(--text);
      padding:10px 12px;
      border-radius:999px;
      cursor:pointer;
      transition:.16s ease;
      white-space:nowrap;
    }

    .btn:hover{
      background:rgba(255,255,255,.07);
      border-color:var(--stroke2);
    }

    .btnPrimary{
      border-color:rgba(29,185,84,.32);
      background:rgba(29,185,84,.14);
    }

    .btnPrimary:hover{
      background:rgba(29,185,84,.20);
      border-color:rgba(29,185,84,.48);
    }

    .btnDanger{
      border-color:rgba(255,111,125,.28);
      background:rgba(255,111,125,.10);
    }

    .btnDanger:hover{
      background:rgba(255,111,125,.16);
      border-color:rgba(255,111,125,.42);
    }

    .main{
      padding:18px;
      min-width:0;
    }

    .hero{
      padding:18px;
      border:1px solid var(--stroke);
      border-radius:18px;
      background:
        radial-gradient(700px 220px at 0% 0%, rgba(29,185,84,.14), transparent 60%),
        radial-gradient(700px 220px at 100% 0%, rgba(88,101,242,.16), transparent 60%),
        rgba(255,255,255,.03);
      margin-bottom:16px;
    }

    .heroTop{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:16px;
      flex-wrap:wrap;
    }

    .heroTitle{
      font-size:32px;
      font-weight:900;
      letter-spacing:-.03em;
      margin:0;
    }

    .heroMeta{
      margin-top:6px;
      color:var(--muted);
      font-size:14px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:16px;
      flex-wrap:wrap;
    }

    .searchWrap{
      flex:1;
      min-width:280px;
      display:flex;
      gap:10px;
      align-items:center;
    }

    .search{
      width:100%;
      border:1px solid var(--stroke);
      background:rgba(0,0,0,.20);
      color:var(--text);
      padding:12px 14px;
      border-radius:999px;
      outline:none;
      font-size:14px;
    }

    .search:focus{
      border-color:rgba(88,101,242,.38);
      box-shadow:0 0 0 6px rgba(88,101,242,.08);
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:14px;
    }

    @media (max-width:1280px){ .grid{grid-template-columns:repeat(4,minmax(0,1fr));} }
    @media (max-width:980px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr));} }
    @media (max-width:700px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr));} }

    .card{
      border:1px solid var(--stroke);
      background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.025));
      border-radius:18px;
      padding:12px;
      cursor:pointer;
      transition:.16s ease;
      min-height:240px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .card:hover{
      transform:translateY(-2px);
      border-color:var(--stroke2);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
    }

    .cover{
      width:100%;
      aspect-ratio:1/1;
      border-radius:14px;
      overflow:hidden;
      border:1px solid var(--stroke);
      background:
        linear-gradient(145deg, rgba(88,101,242,.18), rgba(29,185,84,.14)),
        rgba(0,0,0,.25);
      position:relative;
    }

    .cover img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .fallback{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      padding:12px;
      text-align:center;
      font-weight:800;
      letter-spacing:.06em;
      color:rgba(255,255,255,.76);
      font-size:12px;
      text-transform:uppercase;
    }

    .trackTitle{
      font-size:14px;
      font-weight:800;
      line-height:1.18;
      letter-spacing:.01em;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
      min-height:34px;
    }

    .trackMeta{
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .cardFooter{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin-top:auto;
    }

    .miniTag{
      font-size:11px;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid rgba(29,185,84,.28);
      background:rgba(29,185,84,.10);
      color:rgba(29,185,84,.95);
      max-width:110px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .iconBtn{
      width:38px;height:38px;
      border-radius:999px;
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.04);
      color:var(--text);
      cursor:pointer;
      display:grid;
      place-items:center;
      transition:.16s ease;
    }

    .iconBtn:hover{
      background:rgba(255,255,255,.08);
      border-color:var(--stroke2);
    }

    .iconBtnPrimary{
      background:linear-gradient(180deg, rgba(29,185,84,.22), rgba(29,185,84,.16));
      border-color:rgba(29,185,84,.30);
    }

    .iconBtnPrimary:hover{
      background:linear-gradient(180deg, rgba(29,185,84,.28), rgba(29,185,84,.20));
      border-color:rgba(29,185,84,.46);
    }

    .empty{
      display:none;
      padding:22px;
      text-align:center;
      color:var(--muted);
      border:1px dashed rgba(255,255,255,.12);
      border-radius:18px;
      background:rgba(255,255,255,.02);
    }

    .playerBar{
      position:fixed;
      left:0; right:0; bottom:0;
      padding:10px 14px;
      background:rgba(10,14,22,.92);
      border-top:1px solid var(--stroke);
      backdrop-filter: blur(14px);
      z-index:999;
    }

    .playerInner{
      max-width:1600px;
      margin:0 auto;
      display:grid;
      grid-template-columns:360px 1fr 260px;
      gap:12px;
      align-items:center;
    }

    @media (max-width:980px){
      .playerInner{grid-template-columns:1fr}
    }

    .np{
      display:flex;
      gap:10px;
      align-items:center;
      min-width:0;
    }

    .npCover{
      width:52px;height:52px;
      border-radius:14px;
      overflow:hidden;
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.04);
      flex:0 0 auto;
    }

    .npCover img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .npText{min-width:0}
    .npTitle{
      font-size:13px;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .npArtist{
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      margin-top:2px;
    }

    .controls{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      margin-bottom:6px;
    }

    .seekWrap{
      display:flex;
      align-items:center;
      gap:10px;
      max-width:620px;
      margin:0 auto;
    }

    .time{
      width:46px;
      text-align:center;
      font-size:12px;
      color:var(--muted);
      user-select:none;
    }

    input[type="range"]{width:100%}

    .rightControls{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:10px;
      flex-wrap:wrap;
    }

    .modePill{
      font-size:11px;
      padding:5px 10px;
      border-radius:999px;
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.03);
      color:rgba(255,255,255,.82);
      cursor:pointer;
      transition:.16s ease;
    }

    .modePill:hover{
      background:rgba(255,255,255,.06);
      border-color:var(--stroke2);
    }

    .modePill.active{
      border-color:rgba(29,185,84,.28);
      background:rgba(29,185,84,.10);
      color:rgba(29,185,84,.96);
    }

    .modal{
      position:fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,.72);
      z-index:9999;
      padding:18px;
    }

    .modalCard{
      width:min(520px, 96vw);
      background:linear-gradient(180deg, rgba(17,24,39,.98), rgba(15,23,37,.98));
      border:1px solid var(--stroke);
      border-radius:20px;
      overflow:hidden;
      box-shadow:var(--shadow);
    }

    .modalHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:14px 16px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .modalHead h3{
      margin:0;
      font-size:15px;
      font-weight:800;
    }

    .modalBody{
      padding:16px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
      margin-bottom:12px;
    }

    .field label{
      font-size:12px;
      color:var(--muted);
    }

    .field input{
      padding:11px 12px;
      border-radius:12px;
      border:1px solid var(--stroke);
      background:rgba(0,0,0,.20);
      color:var(--text);
      outline:none;
    }

    .field input:focus{
      border-color:rgba(88,101,242,.38);
      box-shadow:0 0 0 6px rgba(88,101,242,.08);
    }

    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      margin-top:10px;
    }

    .err{
      color:rgba(255,160,170,.95);
      font-size:13px;
      min-height:18px;
      margin-top:8px;
    }
  </style>
</head>
<body>

  <div class="app">
    <aside class="panel sidebar">
      <div class="brand">
        <div class="brandLeft">
          <div class="mark"></div>
          <div class="brandText">
            <div class="title">Streamify</div>
            <div class="sub">Your library, cleaner and faster</div>
          </div>
        </div>
        <div class="chip" id="statusChip">Ready</div>
      </div>

      <div class="section">
        <div class="sectionHead"><span>Library</span></div>
        <button class="navBtn active" id="btnAll">
          <span>All Songs</span>
          <span class="pill" id="countAll">0</span>
        </button>
        <button class="navBtn" id="btnLiked">
          <span>Liked Songs</span>
          <span class="pill" id="countLiked">0</span>
        </button>
      </div>

      <div class="section">
        <div class="sectionHead"><span>Categories</span></div>
        <div class="categoryList" id="categoryList"></div>
      </div>

      <div class="section">
        <div class="sectionHead">
          <span>Playlists</span>
          <button class="btn btnPrimary" id="btnNewPlaylist" style="padding:8px 10px;">+ New</button>
        </div>
        <div class="playlistList" id="playlistList"></div>
      </div>

      <div class="section">
        <div class="sectionHead">
          <span>Account</span>
          <button class="btn btnDanger" id="btnLogout" style="padding:8px 10px;">Logout</button>
        </div>
      </div>
    </aside>

    <main class="panel main">
      <div class="hero">
        <div class="heroTop">
          <div>
            <h1 class="heroTitle" id="sectionTitle">All Songs</h1>
            <div class="heroMeta" id="sectionMeta">0 songs</div>
          </div>

          <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
            <button class="btn" id="btnShuffle">Shuffle</button>
          </div>
        </div>
      </div>

      <div class="topbar">
        <div class="searchWrap">
          <input class="search" id="search" placeholder="Search songs, artists, albums, or categories…" />
          <button class="btn" id="btnClear">Clear</button>
        </div>
      </div>

      <div class="grid" id="grid"></div>
      <div class="empty" id="empty">No songs matched that filter.</div>
    </main>
  </div>

  <div class="playerBar">
    <div class="playerInner">
      <div class="np">
        <div class="npCover"><img id="npImg" alt="" /></div>
        <div class="npText">
          <div class="npTitle" id="npTitle">Nothing playing</div>
          <div class="npArtist" id="npArtist">—</div>
        </div>
      </div>

      <div>
        <div class="controls">
          <button class="iconBtn" id="btnPrev" title="Previous">⟨⟨</button>
          <button class="iconBtn iconBtnPrimary" id="btnPlay" title="Play/Pause">▶</button>
          <button class="iconBtn" id="btnNext" title="Next">⟩⟩</button>
        </div>
        <div class="seekWrap">
          <div class="time" id="tCur">0:00</div>
          <input type="range" id="seek" min="0" max="1000" value="0" />
          <div class="time" id="tDur">0:00</div>
        </div>
      </div>

      <div class="rightControls">
        <div class="modePill" id="pillRepeat">Repeat</div>
        <div class="modePill" id="pillLoop">Loop</div>
        <input type="range" id="vol" min="0" max="100" value="80" style="max-width:170px" />
      </div>
    </div>
  </div>

  <audio id="audio" preload="metadata"></audio>

  <div class="modal" id="authModal">
    <div class="modalCard">
      <div class="modalHead">
        <h3>Login</h3>
        <button class="btn" id="authCloseBtn">Close</button>
      </div>
      <div class="modalBody">
        <div class="field">
          <label>Email</label>
          <input id="authEmail" type="email" placeholder="you@domain.com" />
        </div>
        <div class="field">
          <label>Code</label>
          <input id="authCode" type="text" placeholder="6-digit code" />
        </div>
        <div class="row">
          <button class="btn" id="btnSendCode">Send code</button>
          <button class="btn btnPrimary" id="btnVerify">Verify</button>
        </div>
        <div class="err" id="authErr"></div>
      </div>
    </div>
  </div>

  <div class="modal" id="playlistModal">
    <div class="modalCard">
      <div class="modalHead">
        <h3 id="playlistModalTitle">New playlist</h3>
        <button class="btn" id="playlistClose">Close</button>
      </div>
      <div class="modalBody">
        <div class="field">
          <label>Name</label>
          <input id="playlistName" type="text" placeholder="My playlist" />
        </div>
        <div class="row">
          <button class="btn btnPrimary" id="btnSavePlaylist">Save</button>
          <button class="btn btnDanger" id="btnDeletePlaylist" style="display:none;">Delete</button>
        </div>
        <div class="err" id="playlistErr"></div>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
