<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Streamify</title>
  <link rel="manifest" href="./manifest.json" />

  <style>
    :root{
      --bg:#0b0d12;
      --panel:#101521;
      --stroke:rgba(255,255,255,.10);
      --stroke2:rgba(255,255,255,.16);
      --text:#eef2ff;
      --muted:rgba(238,242,255,.62);
      --accent:#63f59a;
      --danger:#ff7c8a;
      --shadow: 0 20px 70px rgba(0,0,0,.55);
      --r:18px;
      --r2:14px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--text);
      background:
        radial-gradient(1100px 620px at 14% -12%, rgba(99,245,154,.14), transparent 60%),
        radial-gradient(980px 540px at 92% -10%, rgba(123,108,255,.16), transparent 62%),
        radial-gradient(900px 520px at 50% 120%, rgba(255,255,255,.06), transparent 60%),
        var(--bg);
      overflow-x:hidden;
    }
    .shell{
      max-width: 1500px;
      margin: 0 auto;
      padding: 16px;
      padding-bottom: 120px;
      display:grid;
      grid-template-columns: 300px 1fr;
      gap: 14px;
    }
    @media (max-width: 980px){ .shell{grid-template-columns: 1fr} }
    .panel{
      background: rgba(16,21,33,.80);
      border: 1px solid var(--stroke);
      border-radius: var(--r);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,.20);
    }

    .sidebar{
      padding: 12px;
      position: sticky;
      top: 14px;
      height: calc(100vh - 28px);
      overflow:auto;
    }
    @media (max-width: 980px){ .sidebar{position:relative;height:auto} }

    .brand{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 10px 12px;
      border-radius: var(--r2);
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.03);
    }
    .brandLeft{display:flex;gap:10px;align-items:center;min-width:0}
    .mark{
      width:10px;height:10px;border-radius:999px;
      background: var(--accent);
      box-shadow: 0 0 0 8px rgba(99,245,154,.10);
      flex:0 0 auto;
    }
    .brandText{min-width:0}
    .brandText .title{font-weight:860;font-size:14px;letter-spacing:.25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .brandText .sub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .chip{
      font-size:12px;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid rgba(99,245,154,.25);
      background: rgba(99,245,154,.10);
      color: rgba(99,245,154,.95);
      flex:0 0 auto;
    }

    .section{margin-top:14px}
    .sectionHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 0 10px 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .navBtn{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      padding: 10px 10px;
      margin-bottom: 8px;
      border-radius: 14px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.02);
      color: var(--text);
      cursor:pointer;
      transition: .14s ease;
    }
    .navBtn:hover{background:rgba(255,255,255,.05);border-color:var(--stroke2)}
    .navBtn.active{border-color:rgba(99,245,154,.35);background:rgba(99,245,154,.08)}
    .pill{
      font-size:12px;
      padding:2px 9px;
      border-radius:999px;
      background: rgba(255,255,255,.08);
      border:1px solid var(--stroke);
      color: rgba(255,255,255,.86);
      min-width: 32px;
      text-align:center;
    }

    .btn{
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.03);
      color: var(--text);
      padding:10px 12px;
      border-radius: 999px;
      cursor:pointer;
      transition:.14s ease;
      white-space:nowrap;
    }
    .btn:hover{background: rgba(255,255,255,.06);border-color:var(--stroke2)}
    .btnPrimary{
      border-color: rgba(99,245,154,.36);
      background: rgba(99,245,154,.14);
    }
    .btnPrimary:hover{
      border-color: rgba(99,245,154,.55);
      background: rgba(99,245,154,.20);
    }
    .btnDanger{
      border-color: rgba(255,124,138,.38);
      background: rgba(255,124,138,.12);
    }
    .btnDanger:hover{
      border-color: rgba(255,124,138,.58);
      background: rgba(255,124,138,.16);
    }

    .playlistList{display:flex;flex-direction:column;gap:8px}
    .playlistItem{
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding: 10px 10px;
      border-radius: 14px;
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.02);
      cursor:pointer;
      transition:.14s ease;
    }
    .playlistItem:hover{background:rgba(255,255,255,.05);border-color:var(--stroke2)}
    .playlistItem.active{border-color:rgba(99,245,154,.35);background:rgba(99,245,154,.08)}
    .playlistName{
      font-size: 13px;
      font-weight: 750;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
    }

    .main{padding: 14px; overflow:hidden}
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    @media (max-width: 720px){ .topbar{flex-direction:column; align-items:stretch} }

    .searchRow{flex:1; display:flex; gap:10px; align-items:center}
    .search{
      width:100%;
      border:1px solid var(--stroke);
      background: rgba(0,0,0,.18);
      color: var(--text);
      padding: 11px 14px;
      border-radius: 999px;
      outline:none;
    }
    .search:focus{
      border-color: rgba(99,245,154,.36);
      box-shadow: 0 0 0 6px rgba(99,245,154,.08);
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(5, minmax(0,1fr));
      gap: 12px;
    }
    @media (max-width:1240px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));}}
    @media (max-width:980px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));}}
    @media (max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));}}

    .card{
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.03);
      border-radius: 18px;
      padding: 12px;
      cursor:pointer;
      transition: .14s ease;
      display:flex;
      flex-direction:column;
      gap: 10px;
      min-height: 228px;
    }
    .card:hover{background: rgba(255,255,255,.055); border-color: var(--stroke2); transform: translateY(-1px)}
    .cover{
      width:100%;
      aspect-ratio: 1/1;
      border-radius: 14px;
      border: 1px solid var(--stroke);
      background:
        linear-gradient(145deg, rgba(99,245,154,.14), rgba(255,255,255,.06)),
        rgba(0,0,0,.22);
      overflow:hidden;
      position:relative;
    }
    .cover img{width:100%;height:100%;object-fit:cover;display:block}
    .fallback{
      position:absolute; inset:0;
      display:grid; place-items:center;
      font-weight: 900;
      letter-spacing:.8px;
      color: rgba(255,255,255,.72);
      font-size: 13px;
      text-transform: uppercase;
    }
    .trackTitle{
      font-weight: 860;
      font-size: 14px;
      line-height: 1.15;
      letter-spacing: .2px;
      overflow:hidden;
      display:-webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      min-height: 32px;
    }
    .trackMeta{
      font-size: 12px;
      color: var(--muted);
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
    }
    .cardFooter{
      display:flex; align-items:center; justify-content:space-between; gap:8px;
      margin-top:auto;
    }
    .miniTag{
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: rgba(0,0,0,.18);
      color: rgba(255,255,255,.74);
    }
    .miniTag.ok{
      border-color: rgba(99,245,154,.30);
      background: rgba(99,245,154,.10);
      color: rgba(99,245,154,.95);
    }
    .iconBtn{
      width: 38px; height: 38px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.03);
      color: var(--text);
      cursor:pointer;
      display:grid; place-items:center;
      transition:.14s ease;
    }
    .iconBtn:hover{background: rgba(255,255,255,.06); border-color: var(--stroke2)}
    .empty{
      padding: 18px;
      border: 1px dashed rgba(255,255,255,.14);
      border-radius: 16px;
      color: var(--muted);
      text-align:center;
    }

    .playerBar{
      position: fixed;
      left:0;right:0;bottom:0;
      padding: 10px 14px;
      background: rgba(16,21,33,.92);
      border-top: 1px solid var(--stroke);
      backdrop-filter: blur(14px);
      z-index: 999;
    }
    .playerInner{
      max-width: 1500px;
      margin: 0 auto;
      display:grid;
      grid-template-columns: 360px 1fr 280px;
      gap: 12px;
      align-items:center;
    }
    @media (max-width: 980px){ .playerInner{grid-template-columns:1fr; gap:10px} }

    .np{display:flex; gap:10px; align-items:center; min-width:0;}
    .npCover{width:48px;height:48px;border-radius:14px;border:1px solid var(--stroke);background:rgba(255,255,255,.04);overflow:hidden;flex:0 0 auto}
    .npCover img{width:100%;height:100%;object-fit:cover;display:block}
    .npText{min-width:0}
    .npTitle{font-weight: 860; font-size: 13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    .npArtist{font-size: 12px; color: var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;}

    .controls{display:flex; gap:10px; justify-content:center; align-items:center}
    .iconBtnPrimary{border-color: rgba(99,245,154,.44); background: rgba(99,245,154,.18)}
    .iconBtnPrimary:hover{border-color: rgba(99,245,154,.62); background: rgba(99,245,154,.24)}

    .seekWrap{display:flex; align-items:center; gap:10px; max-width: 600px; margin: 0 auto;}
    .time{font-size:12px;color:var(--muted);width:46px;text-align:center;user-select:none}
    input[type="range"]{width:100%}

    .rightControls{display:flex; align-items:center; justify-content:flex-end; gap:10px; flex-wrap:wrap}
    .modePill{
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.03);
      color: rgba(255,255,255,.78);
      cursor:pointer;
      user-select:none;
      transition:.14s ease;
    }
    .modePill:hover{background: rgba(255,255,255,.06); border-color: var(--stroke2)}
    .modePill.active{
      border-color: rgba(99,245,154,.30);
      background: rgba(99,245,154,.10);
      color: rgba(99,245,154,.95);
    }

    .modal{
      position: fixed;
      inset: 0;
      display:none;
      align-items:center;
      justify-content:center;
      background: rgba(0,0,0,.72);
      z-index: 9999;
      padding: 18px;
    }
    .modalCard{
      width: min(640px, 96vw);
      background: rgba(16,21,33,.96);
      border: 1px solid var(--stroke);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .modalHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .modalHead h3{margin:0;font-size:14px;letter-spacing:.2px}
    .modalBody{padding: 14px}
    .field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
    .field label{font-size:12px;color:var(--muted)}
    .field input, .field textarea{
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--stroke);
      background: rgba(0,0,0,.18);
      color: var(--text);
      outline:none;
    }
    .field input:focus, .field textarea:focus{
      border-color: rgba(99,245,154,.36);
      box-shadow: 0 0 0 6px rgba(99,245,154,.08);
    }
    .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:10px}
    .err{color: rgba(255,160,170,.95); font-size: 13px; min-height: 18px; margin-top: 8px;}
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;}
  </style>
</head>
<body>

  <div class="shell">
    <aside class="panel sidebar">
      <div class="brand">
        <div class="brandLeft">
          <div class="mark"></div>
          <div class="brandText">
            <div class="title">Streamify</div>
            <div class="sub">Repo library • playlists • likes</div>
          </div>
        </div>
        <div class="chip" id="statusChip">Ready</div>
      </div>

      <div class="section">
        <div class="sectionHead"><span>Library</span></div>
        <button class="navBtn" id="btnAll"><span>All songs</span><span class="pill" id="countAll">0</span></button>
        <button class="navBtn" id="btnLiked"><span>Liked</span><span class="pill" id="countLiked">0</span></button>
      </div>

      <div class="section">
        <div class="sectionHead">
          <span>Playlists</span>
          <button class="btn btnPrimary" id="btnNewPlaylist" style="padding:8px 10px;">+ New</button>
        </div>
        <div class="playlistList" id="playlistList"></div>
      </div>

      <div class="section">
        <div class="sectionHead">
          <span>Tools</span>
          <div style="display:flex; gap:8px">
            <button class="btn" id="btnReload" style="padding:8px 10px;">Reload</button>
            <button class="btn btnDanger" id="btnLogout" style="padding:8px 10px;">Logout</button>
          </div>
        </div>
        <button class="navBtn" id="btnAddTrack"><span>Generate library entry</span><span class="pill">JSON</span></button>
      </div>
    </aside>

    <main class="panel main">
      <div class="topbar">
        <div class="searchRow">
          <input class="search" id="search" placeholder="Search title, artist, album…" />
          <button class="btn" id="btnClear">Clear</button>
        </div>
        <div style="display:flex; gap:10px; align-items:center; justify-content:flex-end;">
          <button class="btn" id="btnShuffle">Shuffle</button>
        </div>
      </div>

      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" style="display:none;">No tracks match your filters.</div>
    </main>
  </div>

  <div class="playerBar">
    <div class="playerInner">
      <div class="np">
        <div class="npCover"><img id="npImg" alt="" /></div>
        <div class="npText">
          <div class="npTitle" id="npTitle">Nothing playing</div>
          <div class="npArtist" id="npArtist">—</div>
        </div>
      </div>

      <div>
        <div class="controls" style="margin-bottom:6px">
          <button class="iconBtn" id="btnPrev" title="Previous">⟨⟨</button>
          <button class="iconBtn iconBtnPrimary" id="btnPlay" title="Play/Pause">▶</button>
          <button class="iconBtn" id="btnNext" title="Next">⟩⟩</button>
        </div>
        <div class="seekWrap">
          <div class="time" id="tCur">0:00</div>
          <input type="range" id="seek" min="0" max="1000" value="0" />
          <div class="time" id="tDur">0:00</div>
        </div>
      </div>

      <div class="rightControls">
        <div class="modePill" id="pillRepeat" title="Repeat queue">Repeat</div>
        <div class="modePill" id="pillLoop" title="Loop current">Loop</div>
        <div style="width:10px"></div>
        <input type="range" id="vol" min="0" max="100" value="80" style="max-width:170px" />
      </div>
    </div>
  </div>

  <audio id="audio" preload="metadata"></audio>

  <!-- AUTH -->
  <div class="modal" id="authModal">
    <div class="modalCard">
      <div class="modalHead">
        <h3>Login</h3>
        <button class="btn" id="authCloseBtn">Close</button>
      </div>
      <div class="modalBody">
        <div class="field">
          <label>Email</label>
          <input id="authEmail" type="email" placeholder="you@domain.com" />
        </div>
        <div class="field">
          <label>Code</label>
          <input id="authCode" type="text" placeholder="6-digit code" />
        </div>
        <div class="row">
          <button class="btn" id="btnSendCode">Send code</button>
          <button class="btn btnPrimary" id="btnVerify">Verify</button>
        </div>
        <div class="err" id="authErr"></div>
      </div>
    </div>
  </div>

  <!-- Generate Track Entry -->
  <div class="modal" id="trackModal">
    <div class="modalCard">
      <div class="modalHead">
        <h3>Generate library.json entry</h3>
        <button class="btn" id="trackClose">Close</button>
      </div>
      <div class="modalBody">
        <div class="field"><label>YouTube URL (optional)</label><input id="trackYt" type="url" placeholder="https://www.youtube.com/watch?v=..." /></div>
        <div class="field"><label>Local file URL (required)</label><input id="trackUrl" type="text" placeholder="./musicup/My Song.webm" /></div>
        <div class="field"><label>Title</label><input id="trackTitle" type="text" placeholder="Song title" /></div>
        <div class="field"><label>Artist</label><input id="trackArtist" type="text" placeholder="Artist" /></div>
        <div class="field"><label>Album (optional)</label><input id="trackAlbum" type="text" placeholder="Album" /></div>
        <div class="field"><label>Artwork URL (optional)</label><input id="trackArt" type="text" placeholder="./musicup/covers/cover.jpg" /></div>

        <div class="row">
          <button class="btn btnPrimary" id="btnGenerateTrack">Generate + Copy</button>
        </div>

        <div class="field">
          <label>Entry output (paste into <span class="mono">musicup/library.json</span>)</label>
          <textarea id="trackOut" rows="8" class="mono" placeholder="{ ... }"></textarea>
        </div>

        <div class="err" id="trackErr"></div>
      </div>
    </div>
  </div>

  <!-- PLAYLIST -->
  <div class="modal" id="playlistModal">
    <div class="modalCard">
      <div class="modalHead">
        <h3 id="playlistModalTitle">New playlist</h3>
        <button class="btn" id="playlistClose">Close</button>
      </div>
      <div class="modalBody">
        <div class="field"><label>Name</label><input id="playlistName" type="text" placeholder="My playlist" /></div>
        <div class="row">
          <button class="btn btnPrimary" id="btnSavePlaylist">Save</button>
          <button class="btn btnDanger" id="btnDeletePlaylist" style="display:none;">Delete</button>
        </div>
        <div class="err" id="playlistErr"></div>
      </div>
    </div>
  </div>

  <script>
    // Make auth modal close button non-destructive (it just hides).
    // App.js will decide when to show it again.
    document.getElementById("authCloseBtn").onclick = () => {
      document.getElementById("authModal").style.display = "none";
    };
  </script>

  <script src="./app.js"></script>
</body>
</html>
